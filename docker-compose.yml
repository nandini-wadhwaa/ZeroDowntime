
services:

  blue:
    build: ./app
    image: zerodowntime-app:latest
    container_name: blue_app
    environment:
      VERSION: "1.0"
      APP_PORT: "5001"
      HEALTHY: "${BLUE_HEALTHY:-true}"
    ports:
      - "127.0.0.1:5001:5001"
    restart: unless-stopped

  green:
    build: ./app
    image: zerodowntime-app:latest
    container_name: green_app
    environment:
      VERSION: "2.0"
      APP_PORT: "5002"
      HEALTHY: "${GREEN_HEALTHY:-true}"
    ports:
      - "127.0.0.1:5002:5002"
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    container_name: nginx_router
    ports:
      - "8080:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - blue
      - green
    restart: unless-stopped
